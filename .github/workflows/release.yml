name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build release binaries for all platforms ──────────────────────────────────
  build-release:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pathforge-linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/pathforge
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: pathforge-linux-aarch64
            binary: target/aarch64-unknown-linux-gnu/release/pathforge
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pathforge-macos-x86_64
            binary: target/x86_64-apple-darwin/release/pathforge
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pathforge-macos-aarch64
            binary: target/aarch64-apple-darwin/release/pathforge

    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for Linux aarch64)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Build (native)
        if: matrix.cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux)
        if: runner.os == 'Linux' && matrix.cross != true
        run: strip ${{ matrix.binary }}

      - name: Package binary
        run: |
          cp ${{ matrix.binary }} ${{ matrix.artifact }}
          tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ── Create GitHub Release ─────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changes since previous tag
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          else
            CHANGES=$(git log --oneline --no-merges | head -20)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PathForge ${{ github.ref_name }}
          body: |
            ## PathForge ${{ github.ref_name }} 🦀

            A feature-rich BGP-4 daemon written in Rust.

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Installation

            Download the binary for your platform, extract, and run:
            ```bash
            tar xzf pathforge-linux-x86_64.tar.gz
            sudo ./pathforge-linux-x86_64 --local-as 65001 --router-id 10.0.0.1
            ```

            ### Platforms
            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `pathforge-linux-x86_64.tar.gz` |
            | Linux | aarch64 | `pathforge-linux-aarch64.tar.gz` |
            | macOS | x86_64 | `pathforge-macos-x86_64.tar.gz` |
            | macOS | aarch64 (Apple Silicon) | `pathforge-macos-aarch64.tar.gz` |
          files: release-assets/**/*.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
